<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Harness</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #0b0f17 0%, #101828 100%);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .wrap { text-align: center; color: #cbd5e1; user-select: none; }
    .logo {
      width: 88px; height: 88px; margin: 0 auto 22px; border-radius: 22px;
      background: linear-gradient(135deg, #4f7cff, #7a5cff);
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; box-shadow: 0 12px 40px rgba(90, 100, 255, 0.35);
    }
    .title { font-size: 20px; font-weight: 600; color: #f1f5f9; margin-bottom: 8px; }
    .sub { font-size: 13px; color: #7d8aa3; margin-bottom: 26px; }
    .bar {
      width: 220px; height: 4px; margin: 0 auto; border-radius: 99px;
      background: #1e293b; overflow: hidden; position: relative;
    }
    .bar::after {
      content: ""; position: absolute; inset: 0; border-radius: 99px;
      background: linear-gradient(90deg, #4f7cff, #7a5cff);
      animation: load 1.4s ease-in-out infinite;
    }
    @keyframes load { 0% { width: 0% } 55% { width: 70% } 100% { width: 100%; opacity: 0 } }
    .status { margin-top: 18px; font-size: 12px; color: #64748b; min-height: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">🏀</div>
    <div class="title">DeepSeek Harness</div>
    <div class="sub">正在启动本地服务…</div>
    <div class="bar"></div>
    <div class="status" id="status">启动 DSH 后端中</div>
  </div>
</body>
</html>
