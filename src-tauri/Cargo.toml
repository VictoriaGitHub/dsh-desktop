[package]
name = "dsh-desktop"
version = "0.1.1"
description = "DeepSeek Harness 桌面客户端（Tauri v2 封装）"
authors = ["wpy"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
minisign = "0.7"
ureq = { version = "2", features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
