name: Smoke Test (released build)

# 只测试已发布的安装包，不编译：下载 v0.1.1 的 Windows setup.exe → 静默安装 → 启动 → 验证
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Windows"]
    types: [completed]
    branches: [main]

jobs:
  smoke-test:
    runs-on: windows-latest
    steps:
      - name: Download released setup.exe
        shell: pwsh
        run: |
          $url = "https://github.com/VictoriaGitHub/dsh-desktop/releases/download/v0.1.1/DSH.Desktop_0.1.1_x64-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile setup.exe -UseBasicParsing
          $len = (Get-Item setup.exe).Length
          Write-Host "已下载: $([math]::Round($len/1MB,1)) MB"
          if ($len -lt 10MB) { throw "安装包太小，疑似下载失败" }

      - name: Silent install
        shell: pwsh
        run: |
          Write-Host "== 静默安装 =="
          Start-Process -FilePath .\setup.exe -ArgumentList "/S" -Wait
          Start-Sleep 5

      - name: Ensure WebView2 Runtime (Windows Server 无 Edge，需手动装)
        shell: pwsh
        run: |
          Write-Host "== 检查/安装 WebView2 Runtime =="
          $installed = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -ErrorAction SilentlyContinue
          if ($installed) {
            Write-Host "WebView2 已安装: $($installed.pv)"
          } else {
            Write-Host "下载 WebView2 Evergreen Bootstrapper…"
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile webview2.exe -UseBasicParsing
            Start-Process -FilePath .\webview2.exe -ArgumentList "/silent /install" -Wait
            Write-Host "WebView2 安装完成"
          }

      - name: Launch & verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $installDir = Join-Path ${env:ProgramFiles} "DSH Desktop"
          Write-Host "== 1) 内置运行时验证（无头 CI 直接跑 dsh 后端，绕过 GUI）=="
          $node = Join-Path $installDir "runtime\bin\node.exe"
          $dshJs = Join-Path $installDir "runtime\dsh\node_modules\@deepseek-ai\dsh\lib\bin.js"
          Write-Host "node.exe: $(Test-Path $node)"
          Write-Host "dsh bin.js: $(Test-Path $dshJs)"
          $proc = Start-Process -FilePath $node -ArgumentList "`"$dshJs`" web --host 127.0.0.1 --port 3081" -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $env:TEMP "dsh-out.log") -RedirectStandardError (Join-Path $env:TEMP "dsh-err.log")
          Start-Sleep 20
          Write-Host "-- node 进程: $($proc.Id) 存活: $(-not $proc.HasExited)"
          $resp = $null
          try { $resp = Invoke-WebRequest -Uri "http://127.0.0.1:3081/" -UseBasicParsing -TimeoutSec 15 } catch { Write-Host "请求失败: $($_.Exception.Message)" }
          if ($resp) { Write-Host "内置运行时 HTTP: $($resp.StatusCode)" } else { Write-Host "内置运行时 HTTP: 失败" }
          if (-not $resp -or $resp.StatusCode -ne 200) { Get-Content (Join-Path $env:TEMP "dsh-err.log") -Tail 15 -ErrorAction SilentlyContinue; throw "内置运行时后端未响应" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "== 2) GUI 进程启动检查（无头环境仅验证进程能拉起）=="
          $app = Get-ChildItem $installDir -Filter "dsh-desktop.exe" | Select-Object -First 1
          Start-Process -FilePath $app.FullName
          Start-Sleep 10
          $gui = Get-Process -Name "dsh-desktop" -ErrorAction SilentlyContinue
          if ($gui) { Write-Host "GUI 进程已启动: PID $($gui.Id)" } else { Write-Host "GUI 进程未启动（无头环境预期）" }
          Write-Host "== ✅ Smoke test 通过：安装完整 + 内置运行时后端正常 =="
