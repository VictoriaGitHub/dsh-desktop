name: Smoke Test (released build)

# 只测试已发布的安装包，不编译：下载 v0.1.1 的 Windows setup.exe → 静默安装 → 启动 → 验证
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Windows"]
    types: [completed]
    branches: [main]

jobs:
  smoke-test:
    runs-on: windows-latest
    steps:
      - name: Download released setup.exe
        shell: pwsh
        run: |
          $url = "https://github.com/VictoriaGitHub/dsh-desktop/releases/download/v0.1.1/DSH.Desktop_0.1.1_x64-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile setup.exe -UseBasicParsing
          $len = (Get-Item setup.exe).Length
          Write-Host "已下载: $([math]::Round($len/1MB,1)) MB"
          if ($len -lt 10MB) { throw "安装包太小，疑似下载失败" }

      - name: Silent install
        shell: pwsh
        run: |
          Write-Host "== 静默安装 =="
          Start-Process -FilePath .\setup.exe -ArgumentList "/S" -Wait
          Start-Sleep 5

      - name: Ensure WebView2 Runtime (Windows Server 无 Edge，需手动装)
        shell: pwsh
        run: |
          Write-Host "== 检查/安装 WebView2 Runtime =="
          $installed = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -ErrorAction SilentlyContinue
          if ($installed) {
            Write-Host "WebView2 已安装: $($installed.pv)"
          } else {
            Write-Host "下载 WebView2 Evergreen Bootstrapper…"
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile webview2.exe -UseBasicParsing
            Start-Process -FilePath .\webview2.exe -ArgumentList "/silent /install" -Wait
            Write-Host "WebView2 安装完成"
          }

      - name: Launch & verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $installDir = Join-Path ${env:ProgramFiles} "DSH Desktop"
          if (-not (Test-Path $installDir)) { throw "安装目录不存在: $installDir" }
          Write-Host "== 安装目录内容（前 2 层）=="
          Get-ChildItem $installDir -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          Write-Host "== node.exe 是否存在 =="
          $node = Join-Path $installDir "runtime\bin\node.exe"
          Write-Host "node.exe: $(Test-Path $node) at $node"
          $app = Get-ChildItem $installDir -Filter "*.exe" | Where-Object { $_.Name -ne "uninstall.exe" } | Select-Object -First 1
          Write-Host "== 启动: $($app.FullName) =="
          Start-Process -FilePath $app.FullName
          Start-Sleep 40
          Write-Host "== 进程检查 =="
          $procs = Get-Process | Where-Object { $_.ProcessName -like "*dsh*" -or $_.ProcessName -like "*node*" } | Select-Object ProcessName, Id
          $procs | Format-Table | Out-String | Write-Host
          Write-Host "== backend.log =="
          $log = Join-Path $env:USERPROFILE ".dsh-desktop\backend.log"
          if (Test-Path $log) { Get-Content $log -Tail 20 | Write-Host } else { Write-Host "(无 backend.log)" }
          Write-Host "== 后端 HTTP 检查 =="
          $resp = Invoke-WebRequest -Uri "http://127.0.0.1:3080/" -UseBasicParsing -TimeoutSec 15
          Write-Host "HTTP status: $($resp.StatusCode)"
          if ($resp.StatusCode -ne 200) { throw "后端未响应" }
          Write-Host "== ✅ Smoke test 通过：Windows 版可安装、可启动、后端正常 =="
