name: Build Windows

# 触发方式：
#   1. 手动触发（Actions 页面 → Run workflow）
#   2. 推送 v* 标签（自动构建并发布到 Release）
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo (Rust 编译产物，大幅提速后续构建)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache runtime (dsh 依赖树，跳过重复 npm install)
        uses: actions/cache@v4
        with:
          path: src-tauri/runtime
          key: ${{ runner.os }}-runtime-${{ hashFiles('src-tauri/runtime/dsh/node_modules/@deepseek-ai/dsh/package.json') }}
          restore-keys: |
            ${{ runner.os }}-runtime-

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install deps
        run: pnpm install

      - name: Prepare runtime (Windows x64)
        timeout-minutes: 20
        run: node scripts/prepare-runtime.mjs

      - name: Build & sign
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error

      - name: Smoke test (install & launch on real Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          Write-Host "== 1) 静默安装: $($exe.Name)"
          Start-Process -FilePath $exe.FullName -ArgumentList "/S" -Wait
          Start-Sleep 5
          $installDir = Join-Path ${env:ProgramFiles} "DSH Desktop"
          if (-not (Test-Path $installDir)) { throw "安装目录不存在: $installDir" }
          $app = Get-ChildItem $installDir -Filter "*.exe" | Select-Object -First 1
          Write-Host "== 2) 启动: $($app.Name)"
          Start-Process -FilePath $app.FullName
          Start-Sleep 30
          Write-Host "== 3) 进程检查:"
          $procs = Get-Process | Where-Object { $_.ProcessName -like "*dsh*" -or $_.ProcessName -like "*node*" } | Select-Object ProcessName, Id
          $procs | Format-Table | Out-String | Write-Host
          if (-not $procs) { throw "未发现 dsh/node 进程" }
          Write-Host "== 4) 后端 HTTP 检查:"
          $resp = Invoke-WebRequest -Uri "http://127.0.0.1:3080/" -UseBasicParsing -TimeoutSec 15
          Write-Host "HTTP status: $($resp.StatusCode)"
          if ($resp.StatusCode -ne 200) { throw "后端未响应" }
          Write-Host "== ✅ Smoke test 通过 =="

      - name: Publish to Release (workflow_dispatch 或 tag 推送)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'v0.1.1' || github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.sig
